<!DOCTYPE html>
<>
<head>
    <title>Website Saya</title>
  
<style>
  body {
    background-color: #f0f4ff;
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 40px 20px;
  }

  h1 {
    color: #2457c5;
    font-size: 32px;
  }

  p {
    color: #444444;
    font-size: 18px;
  }

  
button {
  background-color: #2457c5;
  color: white;
  padding: 12px 24px;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  cursor: pointer;
  transition: 0.3s;
  box-shadow: 0 4px 8px rgba(36, 87, 197, 0.25);
}

button:hover {
  background-color: #1743a5;
  transform: translateY(-3px);
  box-shadow: 0 7px 14px rgba(36, 87, 197, 0.35);
}

button:active {
  transform: scale(0.96);
}

  
.container {
  background-color: white;
  max-width: 350px;
  margin: 30px auto;
  padding: 25px;
  border-radius: 18px;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
}

</style>

</head>


<body>
  <div class="container">
    <h1>Halo, saya Isna!</h1>
    <p>Saya sedang belajar membuat website.</p>

    
<button onclick="sapaPengunjung()">Klik Saya</button>

<p id="pesan"></p>

  </div>
  
<script>
function sapaPengunjung() {
  document.getElementById("pesan").textContent =
    "Yay! Selamat datang di website saya! 🎉";
}
</script>

</body>
